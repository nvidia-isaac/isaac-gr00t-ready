        name: Developer-Ready Distribution and Availability
        method: Review pricing model, sales channels, procurement workflow; verify shipping coverage, regional entity presence, and localization
        automation: manual
        levels:
          0: No accessible procurement path or availability
          1: Partial (pricing or availability gaps)
          2: Published developer-kit pricing, accessible procurement path, regional/global availability with local-language support and in-country warranty

  - id: nt_supply_chain
