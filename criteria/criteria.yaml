        method: Review production capacity plans and facility certifications; audit supplier agreements and second-source coverage; verify replacement-parts strategy
        automation: manual
        levels:
          0: Cannot manufacture at scale
          1: Partial (capacity or parts commitments incomplete)
          2: Documented monthly capacity and ramp curves, replacement-parts commitment, diversified qualified suppliers

  - id: nt_compliance
    name: Compliance Posture
    section: Non-Technical
    tier1_only: true
    items:
      - id: NT-CP-01
        name: Security Posture and Technical Min Spec
        method: Conduct security audit of firmware, boot chain, and access controls
        automation: manual
        levels:
          0: Unauthorized access vectors found
          1: Minor findings with remediation plan
          2: No unauthorized access vectors — backdoor-free architecture confirmed

  - id: nt_support
    name: Support Structure
    section: Non-Technical
    tier1_only: true
    items:
      - id: NT-SS-01
        name: Ongoing Support Across HW/SW/Logistics
        method: Review support organization, staffing, technical competency; audit ticket-handling infrastructure and escalation procedures
        automation: manual
        levels:
          0: No defined support structure
          1: Partial (channels or SLAs missing)
          2: Defined support channels (portal/forum/email), response-time SLAs by severity, clear escalation path

  - id: nt_documentation
    name: Documentation
    section: Non-Technical
    tier1_only: true
