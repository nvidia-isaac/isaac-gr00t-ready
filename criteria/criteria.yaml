        name: Developer-Ready Documentation
        method: Review documentation completeness against GR00T integration workflow; validate accuracy and version currency
        automation: manual
        levels:
          0: Documentation missing or inadequate
          1: Partial (some guides missing or outdated)
          2: Published quick-start, hardware integration manual, API reference, troubleshooting runbook, and searchable public portal with sample code
