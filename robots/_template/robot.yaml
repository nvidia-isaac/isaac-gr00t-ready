# Robot profile — copy robots/_template/ to robots/<robot_name>/ and fill in.
# Record the specifications and connection details needed to prepare and run tests.

name: _template
vendor: ""
model: ""
tier: self-serve          # self-serve | official

# How to reach the robot's onboard compute (Jetson Thor)
connection:
  ssh_host: ""            # e.g. 192.168.1.100
  ssh_user: ""
  ssh_port: 22
  notes: ""               # jump host, VPN, credentials location, etc.

# Documentation and SDK locations live in sources.yaml (local paths, websites,
# git repos). Use that manifest to find the documentation needed to prepare tests.
sdk:
  language: ""            # python / c++ / ros2 packages ...
  ros2_distro: ""         # e.g. humble
  notes: ""

# Vendor-claimed specs used as references when preparing and interpreting tests.
# Fill from the datasheet; tests compare measured values against these.
specs:
  jetpack_version: ""
  ram_gb: null
  nvme_tb: null
  joint_count: null
  control_frequency_hz: null
  arm_payload_kg: null
  dual_arm_payload_kg: null
  hand_type: ""           # dexterous hand model, or "gripper"
  has_tactile: false
  has_vision_tactile: false
  has_ft_sensor: false
  cameras: []             # e.g. [{name: head_stereo, resolution: 1920x1080, fps: 30}]
  imu_output_hz: null
  wifi: true
  bluetooth: true
  qsfp: false
