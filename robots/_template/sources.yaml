# Source manifest — where to find this robot's documentation and SDK.
#
# When onboarding a robot, the agent reads this manifest and builds a lightweight
# index of each source (sources_index.md) from tables of contents and headings —
# it does NOT read the docs in full. Later, each criteria item triggers a
# targeted search of just the relevant source/section for the API or spec it
# needs. Nothing needs to be copied into the repo; local paths and URLs are both
# fine.
#
# Fields per source:
#   name      short identifier
#   type      local  = file or directory on this machine
#             web    = website / online docs (agent fetches the URL)
#             git    = repository to clone/read (SDK source, examples)
#   location  absolute path, URL, or git URL
#   topics    what this source is authoritative for — helps the agent decide
#             what to read for a given criteria item. Suggested topics:
#             specs, joints, hands, cameras, imu, ft_sensor, tactile, network,
#             compute, power, sdk_api, ros2, teleop, simulation, security, ota,
#             quickstart, troubleshooting
#   notes     access hints (credentials location, which chapters matter, etc.)

sources:
  - name: hardware-datasheet
    type: local
    location: /path/to/robot_datasheet.pdf
    topics: [specs, joints, cameras, compute, power]
    notes: ""

  - name: vendor-docs-portal
    type: web
    location: https://docs.example-robot.com/
    topics: [quickstart, sdk_api, troubleshooting]
    notes: ""

  - name: sdk
    type: git
    location: https://github.com/example/robot-sdk
    topics: [sdk_api, ros2, joints, teleop]
    notes: "python SDK; examples/ folder has joint control samples"
